version: "3.9"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-api-env: &api-environment
  DB_URL: postgresql+asyncpg://f1twin:${DB_PASSWORD:-f1twin_dev}@postgres:5432/f1twin
  REDIS_URL: redis://redis:6379/0
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-f1twin}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-f1twin_dev}
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: ${NEO4J_USER:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-f1twin_dev}
  MILVUS_HOST: milvus
  JAEGER_HOST: jaeger
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
  ENVIRONMENT: ${ENVIRONMENT:-development}

services:
  # ── Data Infrastructure ──
  postgres:
    image: timescale/timescaledb:2.17-pg16
    environment:
      POSTGRES_DB: f1twin
      POSTGRES_USER: f1twin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-f1twin_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f1twin"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *default-logging

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-f1twin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-f1twin_dev}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging: *default-logging

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    logging: *default-logging

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    logging: *default-logging

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-f1twin_dev}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    logging: *default-logging

  milvus:
    image: milvusdb/milvus:v2.4.0
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
    depends_on:
      - etcd
      - minio
    logging: *default-logging

  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    logging: *default-logging

  # ── Observability Stack ──
  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v2.54.0
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=30d"
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-f1twin_admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infra/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./infra/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    logging: *default-logging

  node_exporter:
    image: prom/node-exporter:v1.8.0
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    ports:
      - "9100:9100"
    logging: *default-logging

  # ── API Layer ──
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    environment:
      <<: *api-environment
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    volumes:
      - ./backend:/app
      - ./data:/data
    command: >
      uvicorn app.main:app
      --host 0.0.0.0 --port 8000
      --reload --log-level debug
      --proxy-headers --forwarded-allow-ips='*'
    logging: *default-logging

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    environment:
      <<: *api-environment
    depends_on:
      - redis
      - postgres
      - kafka
    volumes:
      - ./backend:/app
      - ./data:/data
    command: celery -A app.core.celery_app worker -l info -Q ingestion,twin,ml,cv,simulation
    logging: *default-logging

  worker_beat:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    environment:
      <<: *api-environment
    depends_on:
      - redis
      - postgres
    volumes:
      - ./backend:/app
      - ./data:/data
    command: celery -A app.core.celery_app beat -l info --schedule /data/celerybeat-schedule
    logging: *default-logging

  flower:
    image: mher/flower:2.0
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      FLOWER_PORT: 5555
    ports:
      - "5555:5555"
    depends_on:
      - redis
    logging: *default-logging

  mlflow:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.mlflow
    environment:
      MLFLOW_TRACKING_URI: postgresql://f1twin:${DB_PASSWORD:-f1twin_dev}@postgres:5432/f1twin
      MLFLOW_ARTIFACT_ROOT: s3://mlflow/
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-f1twin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-f1twin_dev}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - minio
    logging: *default-logging

  # ── GPU Compute ──
  ray_head:
    image: rayproject/ray:2.30.0-py312
    ports:
      - "10001:10001"
      - "8265:8265"
    command: >
      ray start --head
      --port=6379
      --dashboard-host=0.0.0.0
      --block
    volumes:
      - ./backend:/app
    logging: *default-logging

  # ── API Gateway ──
  kong:
    image: kong:3.7.0
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    ports:
      - "80:8000"
      - "8001:8001"
    volumes:
      - ./infra/kong/kong.yml:/etc/kong/kong.yml
    depends_on:
      - api
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  minio_data:
  kafka_data:
  zookeeper_data:
  neo4j_data:
  prometheus_data:
  grafana_data:
