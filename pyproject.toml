[project]
name = "f1-digital-twin"
version = "0.1.0"
description = "AI-Powered Race Reconstruction, Strategy Analysis, Counterfactual Simulation & Interactive Replay"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "redis[hiredis]>=5.1.0",
    "kafka-python>=2.0.2",
    "aiokafka>=0.11.0",
    "fastf1>=3.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
    "lightgbm>=4.5.0",
    "catboost>=1.2.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "pytorch-lightning>=2.4.0",
    "ray[default,train,tune,serve]>=2.30.0",
    "celery[redis]>=5.4.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0",
    "python-multipart>=0.0.12",
    "orjson>=3.10.0",
    "pyarrow>=17.0.0",
    "duckdb>=1.1.0",
    "minio>=7.2.0",
    "neo4j>=5.24.0",
    "networkx>=3.4.0",
    "mlflow>=2.15.0",
    "wandb>=0.18.0",
    "opencv-python>=4.10.0",
    "supervision>=0.22.0",
    "gymnasium>=1.0.0",
    "stable-baselines3>=2.4.0",
    "plotly>=5.24.0",
    "pyinstrument>=4.6.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "python-dateutil>=2.9.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "pre-commit>=3.8.0",
    "ipython>=8.26.0",
    "jupyter>=1.0.0",
    "watchfiles>=0.24.0",
]
ml = [
    "transformers>=4.44.0",
    "diffusers>=0.30.0",
    "sentence-transformers>=3.0.0",
    "einops>=0.8.0",
    "timm>=1.0.0",
]
cv = [
    "ultralytics>=8.2.0",
    "torchvision>=0.19.0",
    "kornia>=0.7.0",
]
viz = [
    "plotly>=5.24.0",
    "dash>=2.17.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["f1_digital_twin*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4", "T20"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
