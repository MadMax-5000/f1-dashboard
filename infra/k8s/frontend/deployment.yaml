apiVersion: apps/v1
kind: Deployment
metadata:
  name: f1-frontend
  labels:
    app: f1-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: f1-frontend
  template:
    metadata:
      labels:
        app: f1-frontend
    spec:
      containers:
      - name: frontend
        image: f1-digital-twin/frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "https://api.f1twin.io/api/v1"
        - name: NEXT_PUBLIC_WS_URL
          value: "wss://api.f1twin.io"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: f1-frontend
spec:
  selector:
    app: f1-frontend
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP
