replicaCount: 3

image:
  repository: ghcr.io/your-org/f1-digital-twin
  tag: latest
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-secret

environment: production

api:
  port: 8000
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  nodeSelector: {}
  tolerations: []
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - f1-api
            topologyKey: kubernetes.io/hostname

frontend:
  port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 60

worker:
  replicas: 2
  queues: ingestion,twin,ml,cv,simulation
  concurrency: 4
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 4000m
      memory: 4Gi

database:
  host: f1-postgresql
  port: 5432
  name: f1twin
  user: f1twin
  existingSecret: f1-db-secret
  poolSize: 20
  maxOverflow: 10

redis:
  host: f1-redis-master
  port: 6379
  db: 0

kafka:
  brokers:
    - f1-kafka:9092
  topics:
    raceEvents: race.events
    telemetry: race.telemetry
    simulation: twin.simulation

minio:
  endpoint: f1-minio:9000
  accessKey: f1twin
  existingSecret: f1-minio-secret
  buckets:
    - f1-raw
    - f1-processed
    - f1-models
    - f1-video
    - f1-simulations

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/websocket-services: f1-api
  hosts:
    - host: api.f1twin.io
      paths:
        - path: /api
          pathType: Prefix
        - path: /ws
          pathType: Prefix
    - host: app.f1twin.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - api.f1twin.io
        - app.f1twin.io
      secretName: f1twin-tls

serviceAccount:
  create: true
  annotations: {}
  name: ""

podDisruptionBudget:
  enabled: true
  minAvailable: 2

networkPolicy:
  enabled: true
  ingressRules:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8000
        - port: 3000

monitoring:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 10s
  grafana:
    enabled: true
    dashboards:
      enabled: true
      label: grafana_dashboard

postgresql:
  enabled: true
  auth:
    database: f1twin
    username: f1twin
    existingSecret: f1-db-secret
  primary:
    persistence:
      size: 50Gi
    resources:
      requests:
        cpu: 1000m
        memory: 2Gi

redis:
  enabled: true
  architecture: replication
  master:
    persistence:
      size: 10Gi

kafka:
  enabled: true
  persistence:
    size: 50Gi

prometheus:
  enabled: true
  server:
    retention: 30d
    resources:
      requests:
        cpu: 500m
        memory: 2Gi

grafana:
  enabled: true
  adminPassword: f1twin_admin
  persistence:
    enabled: true
    size: 10Gi
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: f1-dashboards
          orgId: 1
          folder: F1 Digital Twin
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards
