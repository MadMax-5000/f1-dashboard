_format_version: "3.0"
_transform: true

services:
  - name: f1-api-service
    url: http://api:8000
    routes:
      - name: api-route
        paths:
          - /api
        strip_path: true
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
    plugins:
      - name: rate-limiting
        config:
          minute: 60
          hour: 1000
          policy: local
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - PATCH
          headers:
            - Content-Type
            - Authorization
          credentials: true
      - name: key-auth
        config:
          key_names:
            - apikey
          hide_credentials: true
      - name: prometheus
        config: {}
      - name: request-transformer
        config:
          add:
            headers:
              - X-Kong-Proxy: true

  - name: f1-ws-service
    url: http://api:8000
    routes:
      - name: ws-route
        paths:
          - /ws
        strip_path: true
        protocols:
          - ws
          - wss
    plugins:
      - name: rate-limiting
        config:
          minute: 30
          policy: local

consumers:
  - username: anonymous
    keyauth_credentials:
      - key: anonymous-key
  - username: f1-analyst
    keyauth_credentials:
      - key: f1-analyst-key
  - username: f1-team
    keyauth_credentials:
      - key: f1-team-key

upstreams:
  - name: api-upstream
    algorithm: least-connections
    targets:
      - target: api:8000
        weight: 100
