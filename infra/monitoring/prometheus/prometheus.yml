global:
  scrape_interval: 10s
  evaluation_interval: 10s
  scrape_timeout: 8s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "f1-api"
    static_configs:
      - targets:
          - "api:8000"
    metrics_path: "/metrics"
    scrape_interval: 5s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "(.*)"
        replacement: "f1-api-$1"

  - job_name: "f1-worker"
    static_configs:
      - targets:
          - "worker:8001"
    metrics_path: "/metrics"

  - job_name: "f1-node"
    static_configs:
      - targets:
          - "node_exporter:9100"
    scrape_interval: 15s

  - job_name: "postgres"
    static_configs:
      - targets:
          - "postgres:9187"
    scrape_interval: 30s

  - job_name: "redis"
    static_configs:
      - targets:
          - "redis:9121"
    scrape_interval: 30s

  - job_name: "kafka"
    static_configs:
      - targets:
          - "kafka:9308"
    scrape_interval: 30s

  - job_name: "jaeger"
    static_configs:
      - targets:
          - "jaeger:16686"
    metrics_path: "/metrics"
    scrape_interval: 15s

  - job_name: "ray"
    static_configs:
      - targets:
          - "ray_head:8265"
    metrics_path: "/metrics"
    scrape_interval: 10s

  - job_name: "mlflow"
    static_configs:
      - targets:
          - "mlflow:5000"
    metrics_path: "/metrics"
    scrape_interval: 30s
